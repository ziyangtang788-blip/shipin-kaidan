<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>整体样子 · 学表格坐在哪儿</title>
<style>
  :root{
    --bg:#15181D; --panel:#1D2127; --panel2:#22262D;
    --ink:#E4E7EB; --ink2:#98A0AA; --ink3:#6C747E;
    --line:#2B3037; --line2:#3A4048; --field:#171B20;
    --acc:#E8A33D; --acc-d:#F0B45C; --acc-soft:rgba(232,163,61,.13); --acc-line:rgba(232,163,61,.38);
    --ok:#4FA37B; --ok-soft:rgba(79,163,123,.13);
    --sale:#E88B6A; --sale-soft:rgba(232,139,106,.12);
    --warn:#E0BA5E; --warn-soft:rgba(224,186,94,.12);
    --info:#7FB0DE; --info-soft:rgba(127,176,222,.12);
    --r:10px; --r-s:7px;
    --ui:"Microsoft YaHei","微软雅黑",-apple-system,"PingFang SC","Segoe UI",sans-serif;
    --figs:Consolas,ui-monospace,"Microsoft YaHei",monospace;
    --doc:"FangSong","仿宋","FangSong_GB2312","SimSun",serif;
    /* 让滚动条、日期选择器、下拉菜单跟着变深色，不然会闪出一块白 */
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;
    line-height:1.65;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
  /* 台灯光晕 —— 整页只有这一处装饰 */
  body::before{content:"";position:absolute;inset:0 0 auto;height:260px;pointer-events:none;z-index:0;
    background:radial-gradient(120% 100% at 50% -30%,rgba(232,163,61,.15),transparent 62%)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  [hidden]{display:none !important}

  /* ---------- 顶栏 ---------- */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:0 24px;min-height:52px;background:rgba(21,24,29,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .topbar .name{font-size:16px;font-weight:700;letter-spacing:.06em}
  .pill{font-size:12.5px;color:var(--ink3);font-family:var(--figs)}
  .pill b{color:var(--ok);font-weight:400}
  .nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .nav button{font:inherit;font-size:13.5px;cursor:pointer;background:none;color:var(--ink2);
    border:none;border-radius:var(--r-s);padding:6px 14px}
  .nav button:hover{color:var(--ink);background:var(--panel2)}
  .nav button[aria-selected="true"]{background:var(--acc-soft);color:var(--acc);font-weight:700}

  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:20px 24px 56px}

  /* ---------- 卡片 ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .card+.card{margin-top:16px}
  .card-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;
    border-bottom:1px solid var(--line)}
  .card-hd h2{margin:0;font-size:14.5px;font-weight:700}
  .card-hd .n{font-family:var(--figs);font-size:12px;color:var(--acc);
    border:1px solid var(--acc-line);border-radius:4px;padding:1px 6px;line-height:1.5}
  .card-hd .sub,.card-hd .right{font-size:12.5px;color:var(--ink3)}
  .card-hd .right{margin-left:auto}
  .card-bd{padding:16px 18px}

  /* ---------- 表单 ---------- */
  /* ★ 2026-08-04 老板：「这个界面……现在太大了，能简化的简化」，选了「标签挪到左边」。
     原来标签在输入框【上面】，每个字段占两行；窗口一窄整块就变成 5 个整行，高得吓人。
     改成标签在【左边】一列 —— 字段一个不少，高度直接省一半。
     宽度够就自动排成两列三列，窄了自己掉成一列。 */
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:8px 18px;align-items:center}
  .field{display:grid;grid-template-columns:4.6em minmax(0,1fr);align-items:center;gap:9px;min-width:0}
  .field>span{font-size:12.5px;color:var(--ink2);margin-bottom:0;text-align:right;white-space:nowrap}
  /* 用 :not(file) 而不是列举 type —— 表格里的数量框没写 type，
     写成 input[type="text"] 会漏掉它，那一格就会白得刺眼 */
  select,textarea,input:not([type="file"]){
    width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--field);
    border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 11px}
  select{cursor:pointer;height:38px}

  /* ===== 可搜索的商品选择框 =====
     原来是个 <select>：一个客户几十上百条价格，滚着挑又慢又容易点到隔壁那条。
     现在「认错必须为 0」之后要点选的行明显变多，这一步成了主要操作量，
     所以换成「打字就筛」的输入框 + 列表。 */
  .cb{position:relative;display:block;margin-top:4px;max-width:340px}
  .cb-in{width:100%;height:34px;box-sizing:border-box;
    background:var(--field);color:var(--ink);border:1px solid var(--line2);
    border-radius:var(--r-s);padding:6px 10px;font-family:var(--ui);font-size:14px}
  .cb-in:focus{outline:none;border-color:var(--acc-line);background:#12161A}
  .cb-in::placeholder{color:var(--ink3)}
  .cb.on .cb-in{border-color:var(--acc-line)}
  /* 用 position:fixed 而不是 absolute：表格外面那层是 .tablewrap{overflow-x:auto}，
     一旦设了 overflow，纵向也会跟着裁 —— 靠下面几行的下拉会被切掉一半。
     贴着屏幕定位就绕开了所有裁剪，位置由 JS 按输入框的实际坐标算。 */
  .cb-list{display:none;position:fixed;z-index:200;
    max-height:290px;overflow-y:auto;background:var(--panel2);
    border:1px solid var(--line2);border-radius:var(--r-s);
    box-shadow:0 10px 26px rgba(0,0,0,.55)}
  .cb.on .cb-list{display:block}
  .cb-op{padding:7px 10px;cursor:pointer;font-size:13.5px;line-height:1.35;
    border-bottom:1px solid var(--line)}
  .cb-op:last-child{border-bottom:none}
  .cb-op .p{color:var(--acc-d);font-family:var(--figs)}
  .cb-op .u{color:var(--ink3)}
  .cb-op .s{color:var(--ink3);font-size:12px;display:block}
  .cb-op.hot,.cb-op:hover{background:var(--acc-soft)}
  .cb-op.pick{color:var(--acc-d)}
  .cb-none{padding:9px 10px;color:var(--ink3);font-size:13px}
  option{background:var(--panel);color:var(--ink)}
  textarea{min-height:170px;resize:vertical;line-height:1.9;font-size:13.5px;font-family:var(--figs)}
  ::placeholder{color:var(--ink3)}

  .btn{font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--acc);color:#15181D;
    border:1px solid var(--acc);border-radius:var(--r-s);padding:9px 20px}
  .btn:hover{background:var(--acc-d);border-color:var(--acc-d)}
  .btn.ghost{background:none;color:var(--ink2);border-color:var(--line2);font-weight:400}
  .btn.ghost:hover{background:var(--panel2);color:var(--ink)}
  .btn.sm{font-size:12.5px;padding:5px 12px;font-weight:400}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{font:inherit;font-size:12px;cursor:pointer;color:var(--ink2);background:none;
    border:1px solid var(--line2);border-radius:999px;padding:3px 11px}
  .chip:hover{border-color:var(--acc);color:var(--acc)}
  .chip.hot{background:var(--acc);color:#15181D;border-color:var(--acc);font-weight:700}
  .needcust{opacity:.4;pointer-events:none}

  /* 客户信息条 */
  /* ══ 搜索式下拉（2026-08-09 · 版本 A）══
     为什么要它：177 家客户里光「中南NN档」就 12 家，差一个数字价目表完全不同。
     浏览器自带的下拉只能用眼睛扫，扫错一行 = 整单价格全错。
     ⛔ 原来的 <select> 一个都没删，藏在后面照旧存值 ——
       JS 那 35 处读写一个字都不用改，也就不会出现「页面死了体检却全绿」。 */
  .pk{position:relative}
  .pk-btn{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:var(--r-s);
          padding:10px 13px;color:var(--ink);font:15px var(--ui);text-align:left;cursor:pointer;
          display:flex;align-items:center;gap:8px;min-height:41px}
  .pk-btn:hover{border-color:var(--line2)}
  .pk-btn.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .pk-btn .pk-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk-btn .pk-t.dim{color:var(--ink3)}
  .pk-btn .pk-c{margin-left:auto;color:var(--ink3);font-size:12px;flex-shrink:0}
  /* fixed 而不是 absolute：外面那层常有 overflow 裁剪，absolute 会被切掉半截 */
  .pk-pop{position:fixed;z-index:300;background:var(--panel2);border:1px solid var(--line2);
          border-radius:var(--r-s);box-shadow:0 14px 34px rgba(0,0,0,.55);
          display:none;overflow:hidden;max-height:min(60vh,420px);flex-direction:column}
  .pk-pop.on{display:flex}
  .pk-sr{padding:9px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
  .pk-sr input{width:100%;background:var(--field);border:1px solid var(--line2);
               border-radius:var(--r-s);padding:9px 12px;color:var(--ink);font:15px var(--ui)}
  .pk-sr input:focus{outline:0;border-color:var(--acc)}
  .pk-list{overflow-y:auto;flex:1}
  .pk-it{padding:9px 13px;display:flex;align-items:center;gap:9px;font-size:14.5px;cursor:pointer;
         border-bottom:1px solid rgba(255,255,255,.03)}
  .pk-it:last-child{border-bottom:0}
  .pk-it:hover,.pk-it.cur{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
  .pk-it em{font-style:normal;color:var(--acc);font-weight:700}
  .pk-it .pk-n{margin-left:auto;color:var(--ink3);font-size:12px;flex-shrink:0}
  .pk-sep{height:1px;background:var(--line2);margin:4px 0}
  .pk-non{padding:14px;color:var(--ink3);font-size:13.5px;text-align:center}
  .pk-tip{padding:7px 13px;color:var(--ink3);font-size:12px;border-top:1px solid var(--line);flex-shrink:0}

  /* ══ 第 1 步那个投放框（2026-08-09）══
     贴进来的图要落在【框里面】，不能掉到框外面 —— 老板 2026-08-09 指出来的。
     做法：边框画在外层 #imgdrop 上，里面的输入框自己不再画边框，
     于是「打的字 + 贴的图 + 识别进度」看着就是同一个盒子。 */
  #imgdrop{background:var(--field);border:1px solid var(--line2);border-radius:var(--r-s);
           padding:11px 13px}
  #imgdrop:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  #imgdrop #raw{background:transparent;border:0;padding:0;width:100%;min-height:150px}
  #imgdrop #raw:focus{outline:0;box-shadow:none}
  #imgdrop .thumbs{margin-top:10px}
  #imgdrop .thumbs:not(:empty)+.s,#imgdrop .s:not(:empty){margin-top:8px}
  /* ★ 识别按钮只此一个：底下那个「识别这一份 →」永久藏起来。
     它的 hidden 属性被十几处 JS 来回改（有图就取消隐藏），
     光在 HTML 上写 hidden 挡不住 —— 得用样式压死。
     ⛔ 元素不许删：JS 还要用它改文字、控制禁用。 */
  #btn-ocr{display:none !important}
  /* 「清空图片」也压掉：每张缩略图右上角本来就有 ✕ 能单独删，
     跟旁边的「清空」并排摆着只是让人多认一个按钮。元素同样不删。 */
  #btn-imgclear{display:none !important}

  /* ══ 三步条（2026-08-09 UI 改版 · 版本 F）══
     顺序是真的顺序：单子先进 → 认客户 → 出单。号码不是装饰。
     只用页面本来就有的变量，不引新颜色（夜台只此一套）。 */
  .stp{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
  .stp:last-child{border-bottom:0;padding-bottom:2px}
  .stp-n{width:25px;height:25px;border-radius:50%;background:var(--acc);color:var(--bg);
         font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;
         flex-shrink:0;margin-top:1px}
  .stp-n.off{background:var(--line2);color:var(--ink3)}
  .stp-b{flex:1;min-width:0}
  .stp-t{font-weight:700;font-size:15px;margin-bottom:9px}
  .stp-t .sub{font-weight:400;font-size:12.5px;color:var(--ink3);margin-left:6px}
  .stp .searchbar{margin-bottom:8px}
  .stp textarea{width:100%}
  .hint{color:var(--ink3);font-size:12px}
  .kv{margin-top:12px;padding:9px 13px;background:var(--field);border-radius:var(--r-s);
    font-size:12.5px;color:var(--ink2);line-height:1.9}
  .kv b{color:var(--ink);font-weight:600}
  .banner{border-radius:var(--r-s);padding:8px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.7}
  .banner.ok{background:var(--ok-soft);color:var(--ink2)}
  .banner.ask{background:var(--warn-soft);color:var(--ink2)}
  .banner b{color:var(--ink)}

  /* ---------- 图片区（收成一条） ---------- */
  .drop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:9px 13px;
    border:1px dashed var(--line2);border-radius:var(--r-s);background:var(--field);
    font-size:13px;color:var(--ink2)}
  .drop.hot{border-color:var(--acc);border-style:solid;background:var(--acc-soft);color:var(--ink)}
  .drop .d-ic{font-size:16px;line-height:1}
  .drop .d-t{flex:1;min-width:200px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;width:100%}
  .thumbs:empty{display:none}
  .thumb-item{position:relative;width:124px}
  .thumb-item img{width:100%;height:88px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line2);display:block;cursor:zoom-in}
  .thumb-item.big{width:100%}
  .thumb-item.big img{height:auto;max-height:420px;object-fit:contain;cursor:zoom-out}
  .thumb-item.loading{height:88px;border:1px dashed var(--line2);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
  .thumb-n{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.66);color:#fff;
    font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;pointer-events:none}
  .thumb-x{position:absolute;right:5px;top:5px;width:21px;height:21px;border:none;border-radius:50%;
    background:rgba(0,0,0,.66);color:#fff;font-size:14px;line-height:21px;padding:0;cursor:pointer}
  .thumb-x:hover{background:#C4633E}
  .s{font-size:12.5px;color:var(--ink3);width:100%}
  .s:empty{display:none}

  /* ---------- 表格 ---------- */
  .tablewrap{overflow-x:auto}
  /* 就地新建品的小表单：认不出的行点「＋ 库里没有，新建」展开 */
  .npbox{margin-top:8px;padding:10px;border:1px solid var(--acc-line);border-radius:var(--r-s);
         background:var(--field);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .npbox input{height:30px;box-sizing:border-box;padding:0 8px;border-radius:6px;
               border:1px solid var(--line2);background:#12161A;color:var(--ink);font:inherit;max-width:160px}
  .npbox .muted{flex-basis:100%}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink3);text-align:left;
    padding:0 8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
  td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:var(--panel2)}
  .num{text-align:right;font-family:var(--figs);font-variant-numeric:tabular-nums;white-space:nowrap}
  th.num{text-align:right}
  .muted{color:var(--ink3);font-size:12.5px}
  .arrow{color:var(--ink3);margin-right:4px}
  td input.qty{width:70px;padding:3px 7px;text-align:right;font-family:var(--figs)}
  /* 单位框：2026-08-17 老板「单位这里不要搞这么大」。
     它一直没有自己的样式，套的是通用 input 的 width:100%、padding:8px 11px ——
     一个「板」字撑成半屏，比旁边 70px 的数量框还宽好几倍。
     跟数量框对齐：一样的高矮、一样的内边距，宽度够放「公斤」两个字就行。 */
  td input.unit-in{width:56px;padding:3px 7px;text-align:center}
  /* 无价的行就地填价：橙边提示「这里等着你填」 */
  td input.fixp{width:74px;padding:3px 7px;text-align:right;font-family:var(--figs);
    border:1px solid var(--acc-line);background:#12161A;color:var(--ink);border-radius:6px}
  td input.fixp::placeholder{color:var(--acc)}

  .tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-left:5px;
    white-space:nowrap;vertical-align:1px}
  .tag.sale{color:var(--sale);background:var(--sale-soft)}
  .tag.warn{color:var(--warn);background:var(--warn-soft)}
  .tag.info{color:var(--info);background:var(--info-soft)}
  .tag.ok{color:var(--ok);background:var(--ok-soft)}

  .alerts{display:grid;gap:8px;margin-bottom:14px}
  .alerts:empty{display:none}
  .alert{font-size:13.5px;line-height:1.75;border-radius:var(--r-s);padding:8px 12px}
  .alert.warn{background:var(--warn-soft)} .alert.sale{background:var(--sale-soft)}
  .alert.info{background:var(--info-soft)}
  .alert b{font-weight:700}
  .alert.warn b{color:var(--warn)} .alert.sale b{color:var(--sale)} .alert.info b{color:var(--info)}

  .empty{color:var(--ink3);text-align:center;padding:34px 10px;font-size:13.5px}

  /* ---------- 客户卡片 / 资料编辑 ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
  .ccard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:var(--field);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
  .ccard:hover{border-color:var(--acc-line);background:var(--panel2)}
  .ccard .cn{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ccard .cm{font-size:12px;color:var(--ink3);font-family:var(--figs)}
  .ccard .cb{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden}
  .seg button{font:inherit;font-size:13px;cursor:pointer;background:none;color:var(--ink2);
    border:none;padding:7px 14px;border-right:1px solid var(--line2)}
  .seg button:last-child{border-right:none}
  .seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc);font-weight:700}
  .back{font:inherit;font-size:13px;cursor:pointer;background:none;color:var(--ink2);
    border:1px solid var(--line2);border-radius:var(--r-s);padding:4px 12px}
  .back:hover{color:var(--acc);border-color:var(--acc-line)}
  td input.ed{width:78px;padding:3px 7px;text-align:right;font-family:var(--figs)}
  td input.ea{width:100%;min-width:110px;padding:3px 7px;font-size:12.5px}
  tr.edited{box-shadow:inset 2px 0 0 var(--acc)}
  tr.off td{opacity:.5}
  /* ===== 有问题的行整行变色 =====
     老板 2026-08-03：「有问题的那几行变个色，我好一下找到，改好之后变回原来色」。
       q-blur 识别没看清（写了 ?）—— 琥珀色，数量框空着等填
       q-diff 各段之和跟表上总数量对不上 —— 红色，回去核那几段
     两个都是「渲染时按当前状态算」，填好了 class 就不加了，颜色自动回去。 */
  tr.q-blur td{background:rgba(232,163,61,.10)}
  tr.q-blur{box-shadow:inset 3px 0 0 var(--acc)}
  tr.q-diff td{background:rgba(224,92,92,.10)}
  tr.q-diff{box-shadow:inset 3px 0 0 #E05C5C}

function 猜分法(串){

function 分一格(串,分法){

  if(分法.用什么==="\u0000") return {份:[],话:"你说了分不开 —— 这几格留着人工填"};

     御口福「1盒*欧巢门窗【K53】 2盒*KC概念餐厅【515】 5盒*甬江小馆【-517】」只能靠这个。 */
  if(分法.用什么==="量锚点"){

    while((mm=量词.exec(串))) ms.push({i:mm.index,j:mm.index+mm[0].length,q:parseFloat(mm[1]),u:mm[2]});
    if(!ms.length) return {份:[],话:"这一格里没有「几斤几板」"};
    return {份:ms.map(function(x,k){
      var 名=前?串.slice(x.j,(ms[k+1]||{i:串.length}).i):串.slice(k?ms[k-1].j:0,x.i);
      return {点位:洗(名),数量:x.q,单位:x.u};
    }),话:""};
  }
  var 片=串.split(分法.用什么).map(function(x){return x.replace(/_+/g,"").trim();}).filter(Boolean);
  var 份=[],缺=0;
  片.forEach(function(p){
    var m=挑量(p,前);
    if(!m){ 份.push({点位:洗(p),数量:null}); 缺++; return; }
    份.push({点位:洗(p.slice(0,m.index)+" "+p.slice(m.index+m[0].length)),
             数量:parseFloat(m[1]),单位:m[2]});

/* 拿一格真的明细当例子，连它那一行表上写的总数一起拿 ——
   分得对不对，靠这个总数一眼就看得出来，不用人去数。 */
/* ⚠ 例子要挑【最复杂的那一格】，不是头一格。
   祺之盛第一格是「1斤**E004」—— 一个点位，看不出该怎么分；
   拿它当例子，人只会挑「整格算一个」，等到第二行「35串**E018-01+25串**E002-01+10串**E020」
   三个点位就全糊成一团了。教一次要教得住整列，就得拿最难的那格教。 */
/* ⚠ 明细列可能【不止一列】—— 只认头一个就会读错那一列（御口福 8/23）。
   哪一列真装着明细，看谁的花样多：分隔符最多、字最长的那一列。 */
function 明细列(读法){
  var 挑=-1,好=-1;
  /* ★ 被错位劈成两半的列，一定要挑【主列】—— 同伴表是按主列记的，
     挑中另一半的话，那张表里落在主列的行就整个读不到（品昌「豆腐(小)」的明细就是这么丢的）。 */
  var 伴=读法.同伴||{};
  for(var c0=0;c0<读法.角色.length;c0++)
    if(读法.角色[c0]==="明细"&&伴[c0]&&伴[c0].length) return c0;
  读法.角色.forEach(function(r,c){
    if(r!=="明细") return;
    /* ⚠ 比【有几行装着明细】，不比【那一格有多长】。
       御口福完整单：真正的明细列 3 行都是明细；隔壁第 6 列只有错位那一行有字，
       可那一格特别长 —— 按「均长」比就会挑中只有一行的那列，整张单读错。 */
    var s=读法.量[c], f=(s.有号+s.长串)*1000+s.均长;
    if(f>好){ 好=f; 挑=c; }
  });

}
/* 两列都叫总数的时候（御口福 OCR 错开一位就是），挑长得最像总数的那一列：
   带斜杠的「1斤/斤」是规格的样子，「2斤(2斤)」才是总数的样子。
   ⚠ 不许拿它去推翻表头 —— 表头说是总数就是总数，这儿只解决【有好几列都是】时用哪一列。 */
function 总数列(读法){
  var 挑=-1,好=-1e9;
  var 伴=读法.同伴||{};
  for(var c0=0;c0<读法.角色.length;c0++)
    if(读法.角色[c0]==="总数"&&伴[c0]&&伴[c0].length) return c0;
  读法.角色.forEach(function(r,c){
    if(r!=="总数") return;
    var s=读法.量[c];
    var 斜=s.样.filter(function(v){ return /[\/／]/.test(v); }).length;
    var f=s.有量*2-斜*5;
    if(f>好){ 好=f; 挑=c; }
  });
  return 挑;
}
function 明细例(rows,读法){
  var c=明细列(读法), c校=总数列(读法);
  function 校(i){ if(c校<0) return null; var t=取量((rows[i]||[])[c校]); return t?t:null; }
  function 花样(v){ return (v.match(/[+＋，,、\n]/g)||[]).length*100+v.length; }
  var 好=null;
  /* ⚠ 不许卡长度 —— 御口福整张表就一行货，明细那格才 6 个字，
     卡「>6 个字」就一格都挑不到，屏幕上摆出个空框，只剩「分不开」一个选项。 */
  function 看(v,校行){ v=字(v); if(!v) return;
    var f=花样(v); if(!好||f>好.f) 好={文:v,校:校(校行),f:f}; }
  if(c>=0) for(var i=读法.起;i<rows.length;i++) 看((rows[i]||[])[c],i);
  if(读法.续行是明细===true) (读法.续行||[]).forEach(function(j){
    /* 明细写在下一行的（祺之盛那种）—— 总数写在上面那一行 */
    var 上=j-1; while(上>读法.起&&是续行(rows[上]||[])>=0) 上--;
    看(rows[j][是续行(rows[j])],上);
  });
  return 好?{文:好.文,校:好.校}:{文:"",校:null};
}
/* 这一格能分成什么样 —— 把几种分法各试一遍，重样的只留一个。
   ★ 老板 8/23：「按 + 分」看着像「加分」。所以【不给他看符号，给他看分完长什么样】。 */
/* ★★ 卡片【照这一格真能拆出来的样子生成】，不是我事先写死那几种（老板 2026-08-23）。
   原话：「如果我们把这个读不懂的加进去，他就可以把读不懂的这些、甚至读错的，
   　　　 告诉他怎么读，就直接出单。」
   写死几种的下场：客户换个写法，选项里【没有对的那张】，人就卡住了 ——
     广晟「( ) 25斤〈128A〉 ( ) 30斤〈128F〉」用的是 ( ) 隔段、数量在前
     御口福「1盒*欧巢门窗【K53】 2盒*KC概念餐厅【515】」压根没有分隔符
   所以：分隔符从这一格里【找出来】，再配上「数量在前 / 数量在后」两种，各算一遍，
   重样的只留一个，加起来跟表上对得上的排最前面 —— 人只要挑绿的那张。 */
/* 这一列所有的明细格（连它那一行表上写的总数） */
function 全部明细(rows,读法){
  var c=明细列(读法), c校=总数列(读法), 出=[];
  function 校(i){ if(c校<0) return null; return 取量((rows[i]||[])[c校]); }
  if(c>=0) for(var i=读法.起;i<rows.length;i++){
    var v=字((rows[i]||[])[c]); if(v) 出.push({文:v,校:校(i)}); }
  if(读法.续行是明细===true) (读法.续行||[]).forEach(function(j){
    var 上=j-1; while(上>读法.起&&是续行(rows[上]||[])>=0) 上--;
    var v2=字(rows[j][是续行(rows[j])]); if(v2) 出.push({文:v2,校:校(上)}); });
  return 出;
}
function 几种分法(rows,读法){
  var 例=明细例(rows,读法), 文=例.文||"";
  if(!文) return [];
  var 全=全部明细(rows,读法), 出=[], 见={}, 试=[];
  ["+","＋","\n","，",",","、","；",";","( )","（）","（ ）","()"].forEach(function(d){
    if(文.indexOf(d)>=0) 试.push(d); });
  试.push("量锚点");        /* 没有分隔符：每出现一次「几斤几板」就是一段 */
  试.push("\u0001");       /* 整格算一个点位（朱鲜生那种，数量在别的列） */
  ["前","后"].forEach(function(顺){
    试.forEach(function(d){
      var 法={用什么:d,顺序:顺};
      var g=分一格(文,法); if(!g.份.length) return;
      /* ★★ 拿【整列】量，不是拿一格量（老板 8/23 江云倒退）。
         例子那一格里恰好没有「(维比奇#教师-6块)0斤」这种坑，
         「数量在前」和「数量在后」在它身上算出来一模一样，一去重就只剩一张卡，
         挑中的偏偏是错的那张 —— 换一行 6块 就被当成了订货量。
         判据只有一个：这一列 N 行里，有几行加起来跟表上写的总数对得上。 */
      var 对=0,量过=0,和们=[];
      全.forEach(function(x){
        var gg=分一格(x.文,法);
        var 有=gg.份.filter(function(y){ return y.数量!=null; });
        var 和=有.length?Math.round(有.reduce(function(a,y){return a+y.数量;},0)*100)/100:null;
        和们.push(和);
        if(!x.校||和==null) return;
        量过++; if(Math.abs(和-x.校.q)<0.001) 对++;
      });
      /* 去重要按【整列的结果】，不是按例子那一格 —— 否则两张不同的卡会被并成一张 */
      var k=和们.join(",")+"|"+g.份.length; if(见[k]) return; 见[k]=1;
      出.push({用什么:d,顺序:顺,份:g.份,对:对,量过:量过,整格:(d==="\u0001")});
    });
  });
  出.sort(function(a,b){ return (b.对-a.对) || (b.份.length-a.份.length); });
  return 出.slice(0,4);
}
/* ★★ 账能证明的就不问（老板 2026-08-23）
   原话：「这种都没有问的必要，肯定是分成 9 份的。」
   判据：某一种分法让【这一列每一行】加起来都跟表上写的总数对得上 —— 那就是它，自己定了。
   ⚠ 三种情况照旧要问：
     · 这张表没有总数列（证不了）
     · 一种全对的都没有（说明哪种都不完全对）
     · 两种都全对（那就是真有岔路，得人拍板） */
function 自动分法(rows,读法){
  if(读法.分法||!要问分法(读法)) return false;
  var 全对=几种分法(rows,读法).filter(function(f){ return f.量过>0&&f.对===f.量过; });
  if(全对.length!==1) return false;
  读法.分法={用什么:全对[0].用什么,顺序:全对[0].顺序,自动:true};
  return true;
}
function 要问分法(读法){
  if(读法.分法) return false;
  var c=明细列(读法);
  if(c>=0&&读法.量[c].有>0) return true;      /* 明细列里真有字才问 */
  return 读法.续行是明细===true;
}
function 排问题(读法){
  var q=[];
  for(var c=0;c<读法.宽;c++) if(读法.把握[c]==="猜") q.push({型:"列",列:c});
  if(读法.续行.length&&读法.续行是明细===null) q.push({型:"续行"});
  if(要问分法(读法)) q.push({型:"分法"});
  return q;
}
function 画结果(结果){
  var h="<table class='res'><thead><tr><th>货名</th><th>多少</th><th>送到哪</th></tr></thead><tbody>";
  结果.forEach(function(L){
    var 坏=L.问&&L.问.length;
    h+="<tr class='"+(坏?"bad":"")+"'><td>"+esc(L.品名||"（这一行没有货名）")+"</td>";
    var 量=(L.合计!=null?L.合计:(L.数量!=null?L.数量:null));
    h+="<td class='num'>"+(量==null?"<span style='color:var(--bad)'>空</span>":量+(L.单位||""))+"</td><td>";
    if(L.点位.length) L.点位.forEach(function(g){
      h+="<span class='pt"+(g.数量==null?" q":"")+"'>"+esc(g.点位||"？")+
         (g.数量!=null?" <b>"+g.数量+(g.单位||"")+"</b>":" <b>?</b>")+"</span>"; });
    else h+="<span style='color:var(--ink3)'>—</span>";
    if(坏) h+="<div class='why'>⚠ "+esc(L.问.join("；"))+"</div>";
    if(L.原文) h+="<div style='color:var(--ink3);font-size:12.5px;word-break:break-all'>原文："+esc(L.原文.slice(0,120))+"</div>";
    h+="</td></tr>";
  });
  return h+"</tbody></table>";
}
function 画原表(rows,读法,热){
  var h="<table class='raw'><thead><tr><th>行</th>";
  for(var c=0;c<读法.宽;c++) h+="<th>第"+(c+1)+"列</th>";
  h+="</tr></thead><tbody>";
  rows.forEach(function(r,i){
    h+="<tr><td style='color:var(--ink3)'>"+(i+1)+"</td>";
    for(var c=0;c<读法.宽;c++)
      h+="<td class='"+(c===热?"hot":(读法.角色[c]==="不用"?"no":""))+"'>"+esc(字(r[c]))+"</td>";
    h+="</tr>";
  });
  return h+"</tbody></table>";
}

  摊开步3();
  var q=剩[0];
  $("步3题").textContent="这张表怎么读？　（第 "+(答过+1)+" 问 · 共 "+(答过+剩.length)+" 问）";
  $("学").innerHTML=(回话?画回话():"")+问(q);
  $("原表").innerHTML=画原表(rows,读法,q.型==="列"?q.列:-1);
  摆核对(读(rows,读法),"");
  压(剩.length);            /* 没答完 → 核对压住 */
}
function 这一问(){ return 排问题(读法)[0]; }

function 问(q){
  if(q.型==="列"){
    var c=q.列, s=读法.量[c], w=读法.表头行>=0?字(rows[读法.表头行][c]):"";
    var 猜=读法.角色[c];
    var 由=(读法.因||[])[c]||"";
    var 话=(由==="重名")?("货名那一列已经是第 "+((读法.名列||0)+1)+" 列了。"):"";
    var h="<div class='ask'>";
    if(!摊开){
      h+="<h3>第 "+(c+1)+" 列是【"+猜+"】吗？</h3>";
      if(话) h+="<div class='why'>"+话+"</div>";
      h+="<div class='chips'>"+s.样.map(function(v){return "<span>"+esc(v.slice(0,30))+"</span>";}).join("")+"</div>";
      h+="<div class='btn-row'><button class='btn' onclick=\"答列('"+猜+"')\">对</button>"+
         "<button class='btn ghost' onclick='摊开别的()'>不是，是别的</button></div>";
      return h+"</div>";
    }
    h+="<h3>那第 "+(c+1)+" 列是什么？</h3>";
    h+="<div class='chips'>"+s.样.map(function(v){return "<span>"+esc(v.slice(0,30))+"</span>";}).join("")+"</div>";
    h+="<div class='btn-row'>";
    角色们.forEach(function(r){ if(r===猜) return;
      h+="<button class='btn ghost sm' onclick=\"答列('"+r+"')\">"+r+"</button>"; });
    return h+"</div></div>";
  }
  if(q.型==="续行"){
    var i=读法.续行[0];
    return "<div class='ask'><h3>有 "+读法.续行.length+" 行只有一格有字，是上一行的明细吗？</h3>"+
      "<div class='one'>"+esc(字(rows[i][是续行(rows[i])]))+"</div>"+
      "<div class='btn-row'><button class='btn' onclick='答续行(1)'>是，接在上一行</button>"+
      "<button class='btn ghost' onclick='答续行(0)'>不是，这几行不要</button></div></div>";
  }
  var 例=明细例(rows,读法), 法们=几种分法(rows,读法);
  if(挑第几>=法们.length) 挑第几=0;
  var f=法们[挑第几];
  var h2="<div class='ask'><h3>这一格这么分，对吗？</h3>";
  h2+="<div class='one'>"+esc(例.文)+"</div>";
  if(!f) return h2+"<div class='btn-row'><button class='btn' onclick='答分法(-1)'>分不开，我自己填</button></div></div>";
  var 全对=(f.量过&&f.对===f.量过);
  h2+="<div class='pick'><div class='pn'>分成 "+f.份.length+" 份"+(f.整格?"（整格算一个点位）":"")+"</div>";
  f.份.slice(0,5).forEach(function(g){
    h2+="<div class='pl'>"+esc((g.点位||"？").slice(0,28))+"　<b>"+
        (g.数量==null?"没有数量":(g.数量+(g.单位||"")))+"</b></div>"; });
  if(f.份.length>5) h2+="<div class='pl' style='color:var(--ink3)'>…还有 "+(f.份.length-5)+" 份</div>";
  if(f.量过) h2+="<div class='ps' style='color:"+(全对?"var(--ok)":"var(--sale)")+"'>"+
    (全对?("✓ 这一列 "+f.量过+" 行加起来都跟表上对得上")
         :("△ 这一列 "+f.量过+" 行里只有 "+f.对+" 行对得上"))+"</div>";
  h2+="</div><div class='btn-row'><button class='btn' onclick=\"答分法("+挑第几+")\">对，就这么分</button>"+
      (法们.length>1?"<button class='btn ghost' onclick='换一种()'>换一种看看</button>":"")+
      "<button class='btn ghost' onclick='答分法(-1)'>分不开，我自己填</button></div>";
  return h2+"</div>";
}

function 记账(){ var r=读(rows,读法); 存档={好:好几样(r),读法:JSON.parse(JSON.stringify(读法))}; }
function 报(说){
  var r=读(rows,读法), 剩=排问题(读法).length;
  回话={说:说, 好:好几样(r), 坏:坏几样(r), 剩:剩, 差:剩?null:(好几样(r)-存档.好)};
  答过++; 下一问();
}
function 画回话(){
  var v=回话;
  if(v.剩) return "<div class='echo'>"+esc(v.说)+"　→　还剩 "+v.剩+" 处要问</div>";
  return "<div class='echo good'>"+esc(v.说)+"　→　现在 "+v.好+" 样读得通</div>";
}
function 摊开别的(){ 摊开=true; 下一问(); }
function 答列(r){ 记账(); var c=这一问().列; 摊开=false;
  读法.角色[c]=r; 读法.把握[c]="稳"; 报("第 "+(c+1)+" 列定成「"+r+"」"); }
function 答续行(v){ 记账(); 读法.续行是明细=!!v; 报(v?"那几行接到上一行去":"那几行不要"); }
function 换一种(){ 挑第几=(挑第几+1)%Math.max(1,几种分法(rows,读法).length); 下一问(); }
function 答分法(i){ 记账();
  if(i<0){ 读法.分法={用什么:"\u0000"}; 报("这一格分不开，留着人工填"); return; }
  var f=几种分法(rows,读法)[i];
  if(!f){ 读法.分法={用什么:"\u0000"}; 报("这一格分不开，留着人工填"); return; }
  读法.分法={用什么:f.用什么,顺序:f.顺序}; 报("这一格分成 "+f.份.length+" 份"); }

/* 问完了：第 3 步换成一行「记住吗」，货摆到底下的「核对」里去 */
function 完了(){
  var 结果=读(rows,读法);
  if(学过[名]){ 收起步3(); 摆核对(结果,"","这张表教过了 —— 一句都没问"); return; }
  /* ★ 一句都没问就读通了 —— 第 3 步根本不该露面（老板：读得懂就直接出单）。
     顺手把这份读法记下来，下次照样不问。 */
  if(答过===0){
    学过[名]=JSON.parse(JSON.stringify(读法)); 存起来();
    收起步3(); 摆核对(结果,"","这张表我全看懂了 —— 一句都没问"); return;
  }
  摊开步3();
  $("步3题").textContent="这张表怎么读？";
  $("学").innerHTML=(回话?画回话():"")+
    "<div class='ask'><h3>问完了 —— 读出 "+好几样(结果)+" 样</h3>"+
    "<div class='why'>下面「核对」里就是读出来的货，对一眼。</div>"+
    "<div class='btn-row'><button class='btn' onclick='记住()'>对，记住这张表怎么读</button>"+
    "<button class='btn ghost' onclick='重来()'>重来一遍</button></div></div>";
  $("原表").innerHTML=画原表(rows,读法,-1);
  摆核对(结果,"");
  压(0);                    /* 问完了 → 松开，货可以看了 */
}
function 记住(){
  学过[名]=JSON.parse(JSON.stringify(读法)); 存起来();
  收起步3(); 摆核对(读(rows,读法),"","记住了 —— 「"+料[名].客户+"」以后发同样的表，一句都不问");
}
function 重来(){ delete 学过[名]; 存起来(); 换(名); }

/* ── 底下那张「核对」卡：读出来的货摆这儿，跟现在的开单台一个位置 ── */
function 摆核对(结果,报错话,好话){
  if(报错话){
    $("核对话").innerHTML="<div class='alert warn'><b>读不了这个文件</b><div style='margin-top:4px'>"+
      esc(报错话)+"　—— 换一份发过来，我不会拿它硬凑一张单。</div></div>";
    $("核对表").innerHTML=""; $("销售单话").textContent="上面读不出来，出不了单。";
    return;
  }
  var 坏=坏几样(结果);
  $("核对话").innerHTML=(好话?("<div class='banner ok'>"+esc(好话)+"</div>"):"")+
    (坏?("<div class='alert warn' style='margin-top:8px'><b>"+坏+" 样要你看一眼</b>"+
         "<div style='margin-top:3px'>数量空着的自己填，填完才让出单。</div></div>"):"");
  $("核对表").innerHTML=画结果(结果);
  $("销售单话").textContent=坏?("还有 "+坏+" 样没定下来，出不了单。"):
    ("共 "+好几样(结果)+" 样，可以出单。");
}

/* 画结果／画原表 用开单台的表格样子 */
function 画结果(结果){
  if(!结果.length) return "<div class='muted'>还读不出东西来。</div>";
  var h="<table style='width:100%;border-collapse:collapse;font-size:14px'>"+
    "<thead><tr><th style='text-align:left;font-weight:400;font-size:12px;color:var(--ink3);padding:5px 8px;border-bottom:1px solid var(--line)'>货名</th>"+
    "<th style='text-align:right;font-weight:400;font-size:12px;color:var(--ink3);padding:5px 8px;border-bottom:1px solid var(--line)'>多少</th>"+
    "<th style='text-align:left;font-weight:400;font-size:12px;color:var(--ink3);padding:5px 8px;border-bottom:1px solid var(--line)'>送到哪</th></tr></thead><tbody>";
  结果.forEach(function(L){
    var 坏=L.问&&L.问.length;
    h+="<tr"+(坏?" style='background:var(--warn-soft)'":"")+">"+
       "<td style='padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top'>"+esc(L.品名||"（这一行没有货名）")+"</td>";
    var 量=(L.合计!=null?L.合计:(L.数量!=null?L.数量:null));
    h+="<td style='padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--figs);white-space:nowrap;vertical-align:top'>"+
       (量==null?"<span style='color:var(--sale)'>空</span>":量+(L.单位||""))+"</td>";
    h+="<td style='padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top'>";
    if(L.点位.length) L.点位.forEach(function(g){
      h+="<span class='pt"+(g.数量==null?" q":"")+"'>"+esc(g.点位||"？")+
         (g.数量!=null?" <b>"+g.数量+(g.单位||"")+"</b>":" <b>?</b>")+"</span>"; });
    else h+="<span class='muted'>—</span>";
    if(坏) h+="<div style='color:var(--sale);font-size:12.5px;margin-top:2px'>⚠ "+esc(L.问.join("；"))+"</div>";
    h+="</td></tr>";
  });
  return h+"</tbody></table>";
}
function 画原表(rows,读法,热){
  var h="<table class='raw'><thead><tr><th>行</th>";
  for(var c=0;c<读法.宽;c++) h+="<th>第"+(c+1)+"列</th>";
  h+="</tr></thead><tbody>";
  rows.forEach(function(r,i){
    h+="<tr><td style='color:var(--ink3)'>"+(i+1)+"</td>";
    for(var c=0;c<读法.宽;c++)
      h+="<td class='"+(c===热?"hot":(读法.角色[c]==="不用"?"no":""))+"'>"+esc(字(r[c]))+"</td>";
    h+="</tr>";
  });
  return h+"</tbody></table>";
}

$("选表").innerHTML=Object.keys(料).map(function(k){
  return "<button data-n='"+k+"' onclick=\"换('"+k+"')\">"+k+"</button>"; }).join("");
换(名);
</script>
</body></html>
