<div class="wrap">

<h1>补商户名 <span class="ver">v1</span></h1>
<p class="lead">
  开单台导出来的 xlsx 拖进来，把「商户名」那一列换成<b>观麦认的商户名</b>，再下载。<br>
  <span class="muted">观麦要的是<b>商户名</b>（三颗菜三水仓），我们导出来的是<b>报价单名</b>（三颗菜）——
  两个不一样，观麦就报「商户异常」。</span>
</p>

<div id="drop" class="drop">
  <div class="big">把 xlsx 拖到这里</div>
  <div class="muted">或者 <button class="btn ghost" id="pick">选文件</button></div>
  <input type="file" id="file" accept=".xlsx" hidden>
</div>

<div id="out" hidden>
  <div class="card" id="who"></div>
  <div class="card" id="detail"></div>
  <div class="row">
    <button class="btn" id="dl" disabled>下载改好的 xlsx</button>
    <button class="btn ghost" id="again">换一个文件</button>
    <span class="muted" id="msg"></span>
  </div>
</div>

<details class="note">
  <summary>观麦模板怎么对（点开看）</summary>
  <p>导入模板里<b>只对这几个</b>就够了：</p>
  <table class="mini">
    <tr><th>观麦那边</th><th>对我们文件的哪一列</th></tr>
    <tr><td>商户名</td><td>商户名</td></tr>
    <tr><td>商品名</td><td>商品名</td></tr>
    <tr><td>下单数</td><td>下单数</td></tr>
    <tr><td>单价</td><td>单价</td></tr>
    <tr><td>单位</td><td>单位</td></tr>
  </table>
  <p class="muted">
    <b>商户SID / 商户编码这两列先别对。</b>里面装的是报价单号（S2999），
    不是商户的编号——对上去反而会出错。等导成功了再说。
  </p>
</details>

</div>
