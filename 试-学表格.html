<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学这张表怎么读</title><style>
:root{
  --bg:#15181D; --panel:#1D2127; --panel2:#22262D;
  --ink:#E4E7EB; --ink2:#98A0AA; --ink3:#6C747E;
  --line:#2B3037; --line2:#3A4048; --field:#171B20;
  --acc:#E8A33D; --acc-d:#F0B45C; --acc-soft:rgba(232,163,61,.13); --acc-line:rgba(232,163,61,.38);
  --ok:#4FA37B; --ok-soft:rgba(79,163,123,.13);
  --bad:#D9705E; --bad-soft:rgba(217,112,94,.13);
  --r:12px; --r-s:8px;
  --ui:"Microsoft YaHei","微软雅黑",-apple-system,"PingFang SC","Segoe UI",sans-serif;
  --figs:Consolas,ui-monospace,"Microsoft YaHei",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.65}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 22px;min-height:50px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .who{font-size:15px;font-weight:700}
.topbar .step{font-size:13px;color:var(--acc);font-family:var(--figs)}
.picker{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap}
.picker button{font:inherit;font-size:13px;cursor:pointer;background:none;color:var(--ink3);
  border:1px solid transparent;border-radius:6px;padding:4px 11px}
.picker button:hover{color:var(--ink)}
.picker button[aria-selected="true"]{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}

.stage{max-width:760px;margin:0 auto;padding:46px 22px 40px}

/* 上一步答完的回话 —— 整个流程就靠这一行 */
.echo{border-radius:var(--r-s);padding:10px 15px;font-size:14.5px;margin-bottom:26px;
  border:1px solid var(--line2);background:var(--panel)}
.echo.good{border-color:rgba(79,163,123,.45);background:var(--ok-soft);color:var(--ok)}
.echo.warn{border-color:rgba(217,112,94,.45);background:var(--bad-soft);color:var(--bad)}
.echo b{font-weight:700}
.echo .undo{margin-left:10px;font:inherit;font-size:13px;cursor:pointer;background:none;
  border:1px solid currentColor;border-radius:6px;padding:2px 10px;color:inherit;opacity:.85}

h1{font-size:25px;line-height:1.45;margin:0 0 8px;font-weight:700}
.sub{color:var(--ink2);font-size:14.5px;margin-bottom:20px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 24px}
.chips span{font-family:var(--figs);font-size:14px;background:var(--field);border:1px solid var(--line);
  border-radius:7px;padding:5px 13px}
.one{font-family:var(--figs);font-size:14.5px;background:var(--field);border:1px solid var(--line);
  border-radius:var(--r-s);padding:13px 15px;margin:0 0 24px;word-break:break-all;line-height:1.9}

.btns{display:flex;gap:9px;flex-wrap:wrap}
.btn{font:inherit;font-size:15.5px;cursor:pointer;border-radius:var(--r-s);border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink);padding:11px 20px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.btn.on .g{font-size:11.5px;opacity:.8;font-weight:400}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1A1207;font-weight:700}
.btn.pri:hover{background:var(--acc-d);color:#1A1207}
.btn.sm{font-size:13.5px;padding:6px 14px}
.btn.ghost{background:none;border-color:var(--line)}
/* 分法：不给他看符号，给他看分完长什么样 */
.cards{display:flex;gap:12px;flex-wrap:wrap}
.card{flex:1 1 250px;min-width:250px;border:1px solid var(--line2);background:var(--panel);
  border-radius:var(--r);padding:13px 15px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card .cn{font-size:16px;font-weight:700;margin-bottom:7px}
.card .cl{font-family:var(--figs);font-size:13px;color:var(--ink2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.card .cl b{color:var(--acc);font-weight:400}
.card .cs{margin-top:9px;font-size:13px;color:var(--ink3)}
.card.hit{border-color:rgba(79,163,123,.55);background:linear-gradient(180deg,var(--ok-soft),transparent 70%),var(--panel)}
.card.hit .cn{color:var(--ok)}
.card.hit .cs{color:var(--ok)}
.card.miss .cs,.card .cs.bad{color:var(--bad)}
.more{margin-top:22px}
.more>summary{cursor:pointer;color:var(--ink3);font-size:13.5px;list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary:hover{color:var(--ink2)}
/* ⚠ 原表格子【不许截断】（老板 8/23：「明细要齐全，不能只写一行，后面都看不见」）。
   截断的那一截正好是最要紧的送货点，看不见就没法判断对不对。宁可行高一点。 */
.rawbox{margin-top:12px;overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:var(--r-s)}
table.raw{border-collapse:collapse;font-family:var(--figs);font-size:12px;min-width:100%}
table.raw td,table.raw th{border:1px solid var(--line);padding:4px 8px;text-align:left;
  white-space:pre-wrap;word-break:break-all;vertical-align:top;max-width:620px}
table.raw th{background:var(--panel2);color:var(--ink3);font-weight:400;position:sticky;top:0}
table.raw td.hot{background:var(--acc-soft);color:var(--acc-d)}
table.raw td.no{color:var(--ink3)}

table.res{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
table.res th{text-align:left;font-weight:400;font-size:12.5px;color:var(--ink3);padding:6px 8px;
  border-bottom:1px solid var(--line)}
table.res td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.res td.num{font-family:var(--figs);text-align:right;white-space:nowrap}
table.res tr.bad td{background:var(--bad-soft)}
.pt{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:1px 8px;margin:1px 3px 1px 0;font-size:13px;font-family:var(--figs)}
.pt b{color:var(--acc);font-weight:400}
.pt.q{color:var(--bad);border-color:rgba(217,112,94,.4)}
.why{color:var(--bad);font-size:13px;margin-top:3px}
.big{font-size:19px;font-weight:700;margin:14px 0 4px}
.big.ok{color:var(--ok)}
</style></head><body>

<div class="topbar">
  <div class="who" id="who"></div>
  <div class="step" id="stepno"></div>
  <button class="btn sm ghost" id="seen" onclick="看教过的()"></button>
  <div class="picker" id="pick"></div>
</div>
<div class="stage" id="stage"></div>
<script>

"use strict";
var 角色们=["品名","数量","单位","规格","点位号","点位名","明细","总数","单价","备注","不用"];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function 字(v){return v==null?"":String(v).trim();}
function 取量(s){var m=字(s).match(/^([0-9]+(?:\.[0-9]+)?)\s*([^\s0-9.,()（）\/]{0,3})/);
  return m?{q:parseFloat(m[1]),u:m[2]||""}:null;}
var 单位词=/^(斤|板|盒|包|块|串|条|件|箱|袋|桶|个|只|份|把|碗|公斤|kg|KG|中板|大板|小板|大盒|小盒|大包|小包)$/;
var 量词=/([0-9]+(?:\.[0-9]+)?)\s*(公斤|中板|大板|小板|大盒|小盒|大包|小包|斤|板|盒|包|块|串|条|件|箱|袋|桶|个|只|份|把|碗|kg|KG)/g;
/* 数量只认【紧跟着单位】的那个数 —— 江云「(B163 南方明珠)0.5斤」里的 163 是点位号不是货量。
   ⚠ 一段里可能有两个「几斤几板」，取哪个要看这家怎么写（老板 8/23 广晟）：
     江云「(B163 南方明珠#火锅)0.5斤」　数量在【后】
     广晟「( ) 4板〈K006〉白色框的6斤的那种」数量在【前】—— 取最后一个就把备注里的 6 斤当成了订货量
   取前取后不许由代码定死，做成两张卡让人挑，哪张加起来对得上就是哪张。 */
function 挑量(p,前){
  量词.lastIndex=0; var m,头=null,末=null;
  while((m=量词.exec(p))){ if(!头) 头=m; 末=m; }
  return 前?头:末;
}
function 洗(s){ return 字(s).replace(/[()（）*＊【】〈〉_]/g," ").replace(/\s+/g," ").trim(); }

var 号样=/(?:^|[^0-9A-Za-z])([0-9]{1,3}-[0-9]{1,3}|[A-Za-z]{1,3}[0-9]{2,4}|【[^】]{1,8}】|〈[^〉]{1,8}〉)/;
function 量列(rows,起,c){
  var 有=0,纯数=0,汉字=0,单位=0,长串=0,带号=0,有量=0,有号=0,总长=0,样=[],见={},异=0;
  for(var i=起;i<rows.length;i++){
    var v=字((rows[i]||[])[c]); if(!v) continue;
    有++; 总长+=v.length; if(样.length<6&&样.indexOf(v)<0) 样.push(v);
    if(!见[v]){ 见[v]=1; 异++; }
    if(/^[0-9]+(\.[0-9]+)?$/.test(v)) 纯数++;
    if(单位词.test(v)) 单位++;
    if(/[一-龥]/.test(v)) 汉字++;
    if(v.length>22||/[+＋]/.test(v)) 长串++;
    if(/^[A-Za-z]{0,3}[-]?[0-9]{1,5}([-][0-9]{1,3})?$/.test(v)) 带号++;
    量词.lastIndex=0; if(量词.test(v)) 有量++;      /* 格子里【任何地方】写着「几斤/几板」 */
    if(号样.test(v)) 有号++;                        /* 格子里【任何地方】有个点位号的样子 */
  }
  return {有:有,纯数:纯数,汉字:汉字,单位:单位,长串:长串,带号:带号,有量:有量,有号:有号,
          异:异,均长:有?总长/有:0,样:样};
}
/* ★★ 没用的列自己扔掉，一句都不问（老板 2026-08-23）
   原话：「那些表头啊、那些没用的，就不需要去问，自己抛掉就行了。」
   只问【可能是那四样】的列：什么货 / 多少 / 什么单位 / 送去哪里（CLAUDE.md 头一条）。
   ⚠ 判据要卡得住一件事：广晟那张的第 5 列表头写着一长串「(实收:√,差异填实收)下单数量—客户—商品要求」，
     词表里当然没有，可格子里是「( ) 15斤〈176A〉」—— 有数量、有点位号，
     这种绝不许当没用的悄悄扔掉，那就是江云整列点位丢掉的翻版。
     所以：格子里只要有「几斤几板」或者有点位号的样子，一律要问。 */
var 没用词=/^(序号|编号|商品编码|货号|条码|单价|采购价|供应商报价|金额|总金额|金额（元）|实采\(基本单位\)|实际采购数|操作|状态|一级分类|二级分类|分类名称|参考线路)$/;
function 值得问(s,w,r){
  if(s.有===0) return false;                       /* 空列 */
  if(没用词.test(w)) return false;                  /* 序号、单价、金额、实采… */
  /* ⚠ 「整列一个样」不等于没用 —— 得看那一个样是什么。
     　「0」「元」「斤」这种确实没用；可【一整列都是同一家店名】的多得很
     　（惠隆 3 行都送同一个客户、轩宝就一行货），那是「送去哪里」，扔了就是丢点位。 */
  if(s.异<=1){
    var v=s.样[0]||"";
    if(/^[0-9.]+$/.test(v)||单位词.test(v)||v.length<=2) return false;
  }
  if(s.有量||s.有号) return true;                   /* 有货量、有点位号 —— 一定要问 */
  if(r==="备注") return false;                      /* 认不出是什么、又没有货信息 = 真没用 */
  return true;
}
var 列名词=/^(序号|编号|品名|品类|商品|商品名|商品名称|名称|菜名|货品|品种|物料名称|产品名称|规格|商品规格|单位|数量|下单数|出库数|预定数|计划采购|采购数量|总数|总数量|订菜总数|采购总数|明细|订货明细|订菜分布清单|分布|备注|备注2|点位|点位号|单位编号|门店|客户|客户简称|收货|单价|采购价|金额|总金额|订货|采购|计划|实采\(基本单位\)|企业简称|企业编号)$/;
function 找表头行(rows){
  for(var i=0;i<Math.min(4,rows.length);i++){
    var r=rows[i]||[],数=0,名=0;
    for(var c=0;c<r.length;c++){var v=字(r[c]); if(!v)continue;
      if(/^[0-9]+(\.[0-9]+)?\s*\S{0,3}$/.test(v))数++;
      if(列名词.test(v))名++;}
    if(!数&&名>=2) return i;
  }
  return -1;
}
function 是续行(r){ var 有=0,唯一=-1;
  for(var c=0;c<r.length;c++){ if(字(r[c])){有++;唯一=c;} } return 有===1?唯一:-1; }

/* ★★ 不相干的东西直接报错，不许一列一列问人（老板 2026-08-24）
   原话：「不会有不相关的进来，不相干的直接报错。」
   判据卡在最粗的一层：整张表里【一样能当货名的都没有】，或者【一个数量都没有】——
   封面、台账、空表就是这样。真订单最起码有货名和数量这两样。
   ⚠ 只拦明显不是的。拿不准一律照常往下走 —— 拦错一张真单，比多问两句贵得多。 */
function 像不像订单(rows,读法){
  var 有名=0, 有数=0;
  for(var i=读法.起;i<rows.length;i++){
    var r=rows[i]||[];
    for(var c=0;c<读法.宽;c++){
      var v=字(r[c]); if(!v) continue;
      if(读法.角色[c]==="品名"&&/[一-龥]/.test(v)&&!单位词.test(v)) 有名++;
      量词.lastIndex=0;
      if(量词.test(v)||/^[0-9]+(\.[0-9]+)?$/.test(v)) 有数++;
    }
  }
  if(!有名) return "这上面找不到一样货 —— 不像订单";
  if(!有数) return "这上面一个数量都没有 —— 不像订单";
  return "";
}
function 猜读法(rows){
  var 头=找表头行(rows), 起=头<0?0:头+1;
  var 宽=0; rows.forEach(function(r){ if(r.length>宽)宽=r.length; });
  var 头词=头<0?[]:(rows[头]||[]);
  /* 因[c] = 这一列【为什么要问】。屏幕上得说真话 ——
     老板 8/23 指着「采购总数」问「？？」：那个词系统当然认识，
     它是因为格子里装的对不上才问的，屏幕却写成「这个词我没见过」。
     理由说错，人就没法判断，只能瞎点。 */
  var 角色=[],把握=[],量=[],因=[];
  for(var c9=0;c9<宽;c9++) 量.push(量列(rows,起,c9));
  /* 先扫一眼：这张表有没有一列是明细（每个点几斤都写在一格里）。
     有的话，旁边那列「几斤几板」就是【总数】不是数量（望家欢「预定数量（汇总）」）。 */
  var 有明细=量.some(function(s){
    return s.有&&(s.长串>=Math.max(2,s.有*0.5)||(s.有号>=s.有*0.6&&s.有量>=s.有*0.6));
  })||/^(明细|订货明细|订菜明细|订菜分布清单|分布|下单明细)$/.test(
      (头词||[]).map(字).filter(function(w){
        return /^(明细|订货明细|订菜明细|订菜分布清单|分布|下单明细)$/.test(w); })[0]||"");
  for(var c=0;c<宽;c++){
    var s=量[c];
    var w=字(头词[c]), r="不用", 稳=false, 由="";
    if(/^(商品名称|商品名|品名|菜名|名称|物料名称|产品名称|货品)$/.test(w)){r="品名";稳=true;}
    else if(/^(数量|下单数|出库数|预定数|订货数)$/.test(w)){r="数量";稳=true;}
    else if(/^(单位)$/.test(w)){r="单位";稳=true;}
    else if(/^(规格|商品规格)$/.test(w)){r="规格";稳=true;}
    else if(/^(单价|采购价)$/.test(w)){r="单价";稳=true;}
    else if(/^(备注|备注2|商品要求)$/.test(w)){r="备注";稳=true;}
    else if(/^(序号|编号)$/.test(w)){r="不用";稳=true;}
    else if(/^(总数|总数量|采购总数|计划采购|采购数量)$/.test(w)){r="总数";稳=true;}
    else if(/^(明细|订货明细|订菜明细|订菜分布清单|分布|下单明细)$/.test(w)){r="明细";稳=true;}
    if(!稳){
      if(s.有===0){ r="不用"; 稳=true; }
      else if(s.长串>=Math.max(2,s.有*0.5)) r="明细";
      /* 一格里【又有几斤几板、又有点位号】—— 那就是明细，哪怕它不长。
         广晟那张：「( ) 15斤〈176A〉」一格一个点，认成备注就整列点位没了。 */
      else if(s.有量>=s.有*0.6&&s.有号>=s.有*0.6) r="明细";
      else if(s.纯数===s.有&&s.有>=2) r="点位号";
      else if(s.单位>=s.有*0.8) r="单位";
      /* 「3斤」「1板」整列都是数字带单位 —— 那是多少，不是货名。
         这一条必须排在「有汉字就当货名」前面：斤板盒也是汉字（望家欢 8/23）。
         ⚠ 这张表要是另有明细列（每个点几斤写在那儿），这一列就是【总数】不是数量 ——
           望家欢的「预定数量（汇总）」正是这样，老板 8/23 点名过。 */
      else if(s.有量>=s.有*0.8&&s.均长<=8) r=有明细?"总数":"数量";
      else if(s.带号>=s.有*0.8) r="点位号";
      else if(s.汉字>=s.有*0.8&&s.均长<=16) r="品名";
      else r="备注";
      if(!稳) 由=w?"生词":"没表头";
    }
    /* 一格内容都没有的列，什么身份都不是 —— 江云「订菜分布清单」表头漂亮、底下全空 */
    if(s.有===0){ r="不用"; 稳=true; }
    /* ★ 表头写着「明细」，格子里却既没有点位号、也没有分隔符 —— 那就不是明细。
       御口福 8/23：OCR 把列整个错开一位，「明细」这个表头底下装的是总数「2斤(2斤)」，
       真正的明细「2斤*嘉禾云门PODO(厨房)月付【543-】」跑到了右边一列。
       只认表头的话，读的是错的那一列，而且一声不吭。 */
    if(稳&&r==="明细"&&!s.有号&&!/[+＋，,、]/.test(s.样.join(""))){ r="总数"; 稳=false; 由="对不上"; }
    /* ⛔ 这儿原来有一条「带斜杠就改判成规格」——【删了】。
       老板 8/23 指着御口福那张说：「它肯定不是规格，它是一个总数，写得很清楚。
       　　　　　　　　　　　　　　　它就是之前说的那个闸口嘛。」
       表头明写着「采购总数」，就按总数用。这一单只有一行货、那个数正好长得像规格，
       不足以推翻表头 —— 一行数据不许推翻表头。

     反过来的话，望家欢那张「分类名称」（面点豆制品）会先被挑成品名，
     真正的「商品名称」被挤成点位名，整张表一样货都读不出来（8/23 撞到）。 */

/* ── 分开一格 ── */
function 猜分法(串){

  候选.forEach(function(d){ var n=串.split(d).length-1; if(n>=1&&(!好||n>好.n)) 好={d:d,n:n}; });

  if(分法.用什么==="\u0000") return {份:[],话:"你说了分不开 —— 这几格留着人工填"};
  var 前=(分法.顺序!=="后");
  /* 「量锚点」：这一格没有分隔符，靠【每出现一次「几斤几板」就是一段】来分。
     御口福「1盒*欧巢门窗【K53】 2盒*KC概念餐厅【515】 5盒*甬江小馆【-517】」只能靠这个。 */
  if(分法.用什么==="量锚点"){
    量词.lastIndex=0; var ms=[],mm;
    while((mm=量词.exec(串))) ms.push({i:mm.index,j:mm.index+mm[0].length,q:parseFloat(mm[1]),u:mm[2]});
    if(!ms.length) return {份:[],话:"这一格里没有「几斤几板」"};
    return {份:ms.map(function(x,k){
      var 名=前?串.slice(x.j,(ms[k+1]||{i:串.length}).i):串.slice(k?ms[k-1].j:0,x.i);
      return {点位:洗(名),数量:x.q,单位:x.u};
    }),话:""};
  }
  var 片=串.split(分法.用什么).map(function(x){return x.replace(/_+/g,"").trim();}).filter(Boolean);
  var 份=[],缺=0;
  片.forEach(function(p){
    var m=挑量(p,前);
    if(!m){ 份.push({点位:洗(p),数量:null}); 缺++; return; }
    份.push({点位:洗(p.slice(0,m.index)+" "+p.slice(m.index+m[0].length)),
             数量:parseFloat(m[1]),单位:m[2]});
  });
  return {份:份,话:(缺&&缺<份.length)?(缺+" 份没找到数量"):""};
}

/* 在这一行里另找一格像总数的（数字＋单位、不带斜杠）。
   ⚠ 只在【正好找到一格】时才用 —— 找出好几格就说明我认不准，宁可不补，让账去喊。

  var 中=[];

    if(c===c校||不碰[读法.角色[c]]) continue;
    var v=字(r[c]); if(!v||/[\/／]/.test(v)) continue;
    if(/^[0-9]+(?:\.[0-9]+)?\s*\S{0,3}(\([^)]*\))?$/.test(v)&&挑量(v,true)) 中.push(v);

/* ── 照读法读一遍：猜的地方一律留空，绝不填 ── */

        q.份.forEach(function(g){ 上.点位.push(g); });

function 好几样(结果){ return 结果.filter(function(L){return L.品名&&!(L.问&&L.问.length);}).length; }
function 坏几样(结果){ return 结果.filter(function(L){return L.问&&L.问.length;}).length; }
/* 拿一格真的明细当例子，连它那一行表上写的总数一起拿 ——
   分得对不对，靠这个总数一眼就看得出来，不用人去数。 */

   祺之盛第一格是「1斤**E004」—— 一个点位，看不出该怎么分；
   拿它当例子，人只会挑「整格算一个」，等到第二行「35串**E018-01+25串**E002-01+10串**E020」
   三个点位就全糊成一团了。教一次要教得住整列，就得拿最难的那格教。 */

/* 这一格能分成什么样 —— 把几种分法各试一遍，重样的只留一个。

function 几种分法(rows,读法){
  var 例=明细例(rows,读法), 文=例.文||"";
  if(!文) return [];
  var 全=全部明细(rows,读法), 出=[], 见={}, 试=[];
  ["+","＋","\n","，",",","、","；",";","( )","（）","（ ）","()"].forEach(function(d){
    if(文.indexOf(d)>=0) 试.push(d); });
  试.push("量锚点");        /* 没有分隔符：每出现一次「几斤几板」就是一段 */
  试.push("\u0001");       /* 整格算一个点位（朱鲜生那种，数量在别的列） */
  ["前","后"].forEach(function(顺){
    试.forEach(function(d){
      var 法={用什么:d,顺序:顺};
      var g=分一格(文,法); if(!g.份.length) return;
      /* ★★ 拿【整列】量，不是拿一格量（老板 8/23 江云倒退）。

         挑中的偏偏是错的那张 —— 换一行 6块 就被当成了订货量。
         判据只有一个：这一列 N 行里，有几行加起来跟表上写的总数对得上。 */
      var 对=0,量过=0,和们=[];
      全.forEach(function(x){
        var gg=分一格(x.文,法);
        var 有=gg.份.filter(function(y){ return y.数量!=null; });
        var 和=有.length?Math.round(有.reduce(function(a,y){return a+y.数量;},0)*100)/100:null;
        和们.push(和);
        if(!x.校||和==null) return;
        量过++; if(Math.abs(和-x.校.q)<0.001) 对++;
      });
      /* 去重要按【整列的结果】，不是按例子那一格 —— 否则两张不同的卡会被并成一张 */
      var k=和们.join(",")+"|"+g.份.length; if(见[k]) return; 见[k]=1;
      出.push({用什么:d,顺序:顺,份:g.份,对:对,量过:量过,整格:(d==="\u0001")});
    });
  });
  出.sort(function(a,b){ return (b.对-a.对) || (b.份.length-a.份.length); });
  return 出.slice(0,4);
}

      "<div class='sub'>比方第 "+(i+1)+" 行写的是：</div>"+
      "<div class='one'>"+esc(字(rows[i][是续行(rows[i])]))+"</div>"+
      "<div class='btns'><button class='btn on' onclick='答续行(1)'>是，接在上一行 <span class=\"g\">我猜的</span></button>"+
      "<button class='btn' onclick='答续行(0)'>不是，这几行不要</button></div>";
  }
  /* ★ 老板 8/23：四张卡里三张长得一模一样，看不出差别 ——「其他选项是什么意思？有没有存在的必要？」
     改成跟别的问题一样的是非题：只摆【最好的那一种】，不对再换下一种。 */
  var 例=明细例(rows,读法), 法们=几种分法(rows,读法);
  if(挑第几>=法们.length) 挑第几=0;
  var f=法们[挑第几];
  var h="<h1>这一格这么分，对吗？</h1>";
  h+="<div class='sub'>分不开我不会自己拼一个。</div>";
  h+="<div class='one'>"+esc(例.文)+"</div>";
  if(!f) return h+"<div class='btns'><button class='btn on' onclick='答分法(-1)'>分不开，我自己填</button></div>";
  var 全对=(f.量过&&f.对===f.量过);
  h+="<div class='card' style='cursor:default;max-width:520px'>";
  h+="<div class='cn'>分成 "+f.份.length+" 份"+(f.整格?"（整格算一个点位）":"")+"</div>";
  f.份.slice(0,5).forEach(function(g){
    h+="<div class='cl'>"+esc((g.点位||"？").slice(0,30))+
       "　<b>"+(g.数量==null?"没有数量":(g.数量+(g.单位||"")))+"</b></div>"; });
  if(f.份.length>5) h+="<div class='cl' style='color:var(--ink3)'>…还有 "+(f.份.length-5)+" 份</div>";
  if(f.量过)
    h+="<div class='cs' style='color:"+(全对?"var(--ok)":(f.对?"var(--ink2)":"var(--bad)"))+"'>"+
       (全对?("✓ 这一列 "+f.量过+" 行加起来都跟表上对得上")
            :(f.对?("△ 这一列 "+f.量过+" 行里只有 "+f.对+" 行对得上")
                  :("✗ 这一列 "+f.量过+" 行一行都对不上")))+"</div>";
  h+="</div>";
  h+="<div class='btns' style='margin-top:18px'>"+
     "<button class='btn"+(全对?" on":"")+"' onclick=\"答分法("+挑第几+")\">对，就这么分</button>"+
     (法们.length>1?"<button class='btn' onclick='换一种()'>换一种看看</button>":"")+
     "<button class='btn' onclick='答分法(-1)'>分不开，我自己填</button></div>";
  return h;
}

/* ③ 你答一件，我马上重读，报一句 */
function 记账(){ var r=读(rows,读法); 存档={好:好几样(r),坏:坏几样(r),读法:JSON.parse(JSON.stringify(读法))}; }
/* ★★ 问完了才比多了少了（老板 8/23 指着那条红杠问「什么意思？」）
   祺之盛那条是【假警报】：他答对了「那几行接在上一行」，系统跟着改口
   ——「计划采购」不是数量、是总数，真数量在明细里 —— 而明细还没问怎么分，
   所以中间那一步暂时读不出数，屏幕上就写「少了 12 样」。答完下一句就全回来了。
   问题没问完的时候那个数字根本不算数，报出来只会吓人。 */
function 报(说){
  var r=读(rows,读法), 剩=排问题(读法).length;
  回话={说:说, 好:好几样(r), 坏:坏几样(r), 剩:剩, 差:剩?null:(好几样(r)-存档.好), 退:存档.读法};
  答过++; 下一问();
}
function 画回话(){
  var v=回话;
  if(v.剩) return "<div class='echo'>"+esc(v.说)+"　→　还剩 "+v.剩+" 处要问</div>";
  var 糟=v.差<0;
  var 变=v.差>0?("多了 "+v.差+" 样"):(糟?("<b>少了 "+(-v.差)+" 样</b>"):"样数没变");
  return "<div class='echo "+(糟?"warn":(v.坏?"":"good"))+"'>"+esc(v.说)+"　→　"+变+
    "，现在 "+v.好+" 样读得通"+(v.坏?("，还有 "+v.坏+" 样对不上"):"，账全对")+
    (糟?" <button class='undo' onclick='退回去()'>退回去</button>":"")+"</div>";
}
function 退回去(){ 读法=回话.退; 回话=null; 答过=Math.max(0,答过-1); 下一问(); }

function 摊开别的(){ 摊开=true; 下一问(); }
function 答列(r){ 记账(); var c=这一问().列; 摊开=false;
  读法.角色[c]=r; 读法.把握[c]="稳"; 报("第 "+(c+1)+" 列定成「"+r+"」"); }
function 答续行(v){ 记账(); 读法.续行是明细=!!v;
  报(v?"那几行接到上一行去":"那几行不要"); }
function 换一种(){ 挑第几=(挑第几+1)%Math.max(1,几种分法(rows,读法).length); 下一问(); }
function 答分法(i){ 记账();
  if(i<0){ 读法.分法={用什么:"\u0000"}; 报("这一格分不开，留着人工填"); return; }
  var f=几种分法(rows,读法)[i];
  if(!f){ 读法.分法={用什么:"\u0000"}; 报("这一格分不开，留着人工填"); return; }
  读法.分法={用什么:f.用什么,顺序:f.顺序};
  报("这一格分成 "+f.份.length+" 份"); }

/* ④ 没得问了 → 看一眼 → 记住 */
function 完了(){
  var 结果=读(rows,读法), 坏=坏几样(结果);
  var h=(回话?画回话():"");
  h+="<h1>问完了 —— 读出 "+好几样(结果)+" 样</h1>";
  h+="<div class='sub'>"+(坏?("还有 <b style='color:var(--bad)'>"+坏+"</b> 样对不上，那几行留着你手工填，其余照常出单。")
                              :"每一样加起来都跟表上写的总数对得上。")+"</div>";
  h+=画结果(结果);
  h+="<div class='btns' style='margin-top:22px'><button class='btn pri' onclick='记住()'>对，记住</button>"+
     "<button class='btn ghost' onclick='开头()'>重来一遍</button></div>";
  画(h);
}
/* ── 我教过的：一屏看完，哪张教错了一眼看得出 ── */
function 看教过的(){
  var ks=Object.keys(学过);
  if(!ks.length){ 画("<h1>还没教过</h1>"); return; }
  var h="<h1>我教过的 "+ks.length+" 张</h1><div class='sub'>哪一行看着不对，点「重教」。</div>";
  ks.forEach(function(k){
    var 法=学过[k], 老rows=(料[k]||{}).rows||[];
    var 结=[]; try{ 结=读(老rows,法); }catch(e){}
    var 好=好几样(结), 坏=坏几样(结);
    h+="<div class='card' style='cursor:default;margin-bottom:12px'>";
    h+="<div class='cn'>"+esc((料[k]||{}).客户||k)+
       " <span style='font-size:13px;font-weight:400;color:"+(坏?"var(--bad)":"var(--ok)")+"'>"+
       "读出 "+好+" 样"+(坏?("，"+坏+" 样对不上"):"，账全对")+"</span></div>";
    法.角色.forEach(function(r,c){
      if(r==="不用") return;
      var w=法.表头行>=0?字((老rows[法.表头行]||[])[c]):"";
      h+="<div class='cl'>"+r+"　＝　第 "+(c+1)+" 列"+(w?("（"+esc(w)+"）"):"")+"</div>";
    });
    if(法.续行是明细===true) h+="<div class='cl'>只有一格有字的那几行　＝　接在上一行</div>";
    if(法.分法) h+="<div class='cl'>明细那一格　＝　"+
      (法.分法.用什么==="\u0000"?"分不开，人工填":(法.分法.用什么==="\u0001"?"整格算一个点位":"分开"))+"</div>";
    h+="<div style='margin-top:10px'><button class='btn sm' onclick=\"重教('"+k+"')\">重教这张</button></div>";
    h+="</div>";
  });
  document.getElementById('stage').innerHTML=h;
  document.getElementById('stepno').textContent="";
  window.scrollTo({top:0});
}
function 重教(k){ delete 学过[k]; 存起来(); 换(k); }

function 记住(){
  学过[名]=JSON.parse(JSON.stringify(读法)); 存起来();
  画("<div class='echo good'>记住了</div>"+
    "<div class='big ok'>「"+esc(料[名].客户)+"」这种表，以后自己读</div>"+
    "<div class='sub'>记住的是<b>哪一列是什么、这一格怎么分</b> —— 不是第几列。"+
    "他改天多加一列、少一列，照样认得。</div>"+
    "<div class='btns' style='margin-top:20px'><button class='btn pri' onclick='开头()'>下次他再发同样的表 →</button></div>");
}

/* ★ 每一屏都留一条回头路（老板 8/23：「没有重新来、重新教这个选项啊」）。
   教过的表一进来就直接出单，原来只有一个「出单」按钮，想改都改不了。 */
function 回头路(){
  return "<div style='margin-top:26px;padding-top:14px;border-top:1px solid var(--line)'>"+
    "<button class='btn sm ghost' onclick=\"重教('"+名+"')\">重新教一遍</button>"+
    (Object.keys(学过).length?" <button class='btn sm ghost' onclick='看教过的()'>我教过的</button>":"")+
    "</div>";
}
function 原表折叠(热){
  return "<details class='more'><summary>看看原表</summary>"+
    "<div class='rawbox'>"+画原表(rows,读法,热)+"</div></details>";
}
function 画(h,热){
  document.getElementById('stage').innerHTML=h+原表折叠(热==null?-1:热)+回头路();
  var 剩=排问题(读法).length;
  document.getElementById('stepno').textContent=剩?("第 "+(答过+1)+" 问　共 "+(答过+剩)+" 问"):"";
  window.scrollTo({top:0});
}
document.getElementById('pick').innerHTML=Object.keys(料).map(function(k){
  return "<button data-n='"+k+"' onclick=\"换('"+k+"')\">"+k+"</button>"; }).join("");
画教过几张();
换(名);
</script>
</body></html>
